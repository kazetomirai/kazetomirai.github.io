<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今天吃什么 - 抽卡决定</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .card-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .display-box {
            width: 100%;
            height: 140px;
            background: linear-gradient(145deg, #f5f7fa, #e4e8ec);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            overflow: hidden;
            position: relative;
            border: 3px solid #fff;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        .food-text {
            font-size: 36px;
            font-weight: 800;
            color: #333;
            transition: all 0.1s ease;
        }

        .food-text.hidden-item {
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientFlow 2s ease infinite;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .draw-btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .draw-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .draw-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .draw-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 弹窗样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #fff;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 1001;
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-text {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 24px;
        }

        .modal-btn {
            padding: 12px 40px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        /* 粒子画布 */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .tip {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .card-container {
                padding: 30px 20px;
            }
            .title {
                font-size: 24px;
            }
            .display-box {
                height: 120px;
            }
            .food-text {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <div class="card-container">
        <h1 class="title">今天吃什么？</h1>
        <p class="subtitle">命运来帮你决定 ✨</p>
        
        <div class="display-box">
            <div class="food-text" id="foodDisplay">???</div>
        </div>

        <button class="draw-btn" id="drawBtn" onclick="startDraw()">开始抽卡</button>
        
        <p class="tip">听说有神秘隐藏款哦～</p>
    </div>

    <!-- 隐藏款弹窗 -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-title">🎉 恭喜抽到隐藏款！🎉</div>
            <div class="modal-text">找小高一起吃</div>
            <button class="modal-btn" onclick="closeModal()">太棒了</button>
        </div>
    </div>

    <script>
        // 普通食物列表
        const normalFoods = [
            '螺蛳粉', '桂林米粉', '兰州拉面', '快餐', '麦当劳',
            '肯德基', '麻辣烫', '黄焖鸡米饭', '沙县小吃', '汉堡王',
            '披萨', '寿司', '烤肉', '火锅', '酸菜鱼',
            '麻辣香锅', '盖浇饭', '牛肉面', '馄饨', '饺子'
        ];

        const hiddenItem = '找小高一起吃';
        const hiddenProbability = 0.1; // 10% 概率

        const foodDisplay = document.getElementById('foodDisplay');
        const drawBtn = document.getElementById('drawBtn');
        const modal = document.getElementById('modal');
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let isDrawing = false;
        let particles = [];

        // 设置画布尺寸
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 粒子类
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 8 + 3;
                this.speedX = (Math.random() - 0.5) * 8;
                this.speedY = (Math.random() - 0.5) * 8 - 3;
                this.color = this.getRandomColor();
                this.life = 1;
                this.decay = Math.random() * 0.015 + 0.01;
            }

            getRandomColor() {
                const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#00d2d3'];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedY += 0.15; // 重力
                this.life -= this.decay;
                this.size *= 0.98;
            }

            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 创建粒子爆炸效果
        function createParticles() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            for (let i = 0; i < 120; i++) {
                particles.push(new Particle(centerX, centerY));
            }
        }

        // 动画循环
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            if (particles.length > 0) {
                requestAnimationFrame(animateParticles);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        // 随机选择结果
        function getResult() {
            if (Math.random() < hiddenProbability) {
                return { text: hiddenItem, isHidden: true };
            } else {
                const randomFood = normalFoods[Math.floor(Math.random() * normalFoods.length)];
                return { text: randomFood, isHidden: false };
            }
        }

        // 开始抽卡
        function startDraw() {
            if (isDrawing) return;
            
            isDrawing = true;
            drawBtn.disabled = true;
            foodDisplay.classList.remove('hidden-item');
            
            const result = getResult();
            let rollCount = 0;
            const totalRolls = 20 + Math.floor(Math.random() * 10); // 滚动次数
            let delay = 50; // 初始间隔

            function roll() {
                // 滚动过程中只显示普通食物
                const randomIndex = Math.floor(Math.random() * normalFoods.length);
                foodDisplay.textContent = normalFoods[randomIndex];
                
                rollCount++;
                
                if (rollCount >= totalRolls) {
                    // 显示最终结果
                    foodDisplay.textContent = result.text;
                    
                    if (result.isHidden) {
                        foodDisplay.classList.add('hidden-item');
                        // 延迟一点弹出弹窗并播放粒子
                        setTimeout(() => {
                            showModal();
                            createParticles();
                            animateParticles();
                        }, 300);
                    }
                    
                    isDrawing = false;
                    drawBtn.disabled = false;
                    return;
                }
                
                // 逐渐变慢
                delay += 8 + rollCount * 0.5;
                setTimeout(roll, delay);
            }
            
            roll();
        }

        // 显示弹窗
        function showModal() {
            modal.classList.add('show');
        }

        // 关闭弹窗
        function closeModal() {
            modal.classList.remove('show');
        }

        // 点击遮罩关闭
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
